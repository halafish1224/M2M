  <script>
    // 倒數計時邏輯
    function updateCountdown() {
      const targetDate = new Date('2026-07-14T00:00:00+09:00');
      const now = new Date();
      const diffTime = targetDate - now;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      const labelEl = document.getElementById('countdownLabel');
      const daysEl = document.getElementById('countdownDays');
      const unitEl = document.getElementById('countdownUnit');

      if (diffDays >= 0) {
        // 演唱會前：倒數天數
        labelEl.textContent = "距離甲子園演唱會還有";
        daysEl.textContent = diffDays;
        unitEl.textContent = "DAYS TO GO";
      } else {
        // 演唱會後：已歷時
        labelEl.textContent = "甲子園演唱會已過去";
        const absDiff = Math.abs(diffDays);
        
        // 簡單計算年、月、日
        const years = Math.floor(absDiff / 365);
        const months = Math.floor((absDiff % 365) / 30);
        const days = absDiff % 30;
        
        let result = "";
        if (years > 0) result += `${years}Y `;
        if (months > 0) result += `${months}M `;
        result += `${days}D`;
        
        daysEl.textContent = result;
        daysEl.style.fontSize = "1.5rem"; // 字多時縮小一點
        unitEl.textContent = "SINCE THE SHOW";
      }
    }

    // 初始化與資料處理 (保留原有的核心功能並優化)
    const CONFIG = {

      dateLocale: "zh-TW"
    };

    // 此處省略了你原本 script 中冗長的 CSV 解析邏輯，請務必保留你原本代碼中的 init(), loadRows(), parseCsv() 等函數。
    // 僅需確保在 init() 中調用 updateCountdown()。

    window.addEventListener('DOMContentLoaded', () => {
      updateCountdown();
      // 如果你原本的代碼已經在運作，請確保 init() 被執行
      if (typeof init === 'function') init(); 
    });

    // 提示：請將你原本 HTML 末尾的 <script> 內容完整貼回此處，並補上 updateCountdown() 的調用即可。
  </script>
